name: Maestro E2E Tests

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

jobs:
  maestro-e2e:
    # Runs if manually triggered OR if the PR has the 'run-e2e' label applied
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: macos-latest # macOS provides hardware acceleration for fast Android Emulators

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install Maestro CLI
      run: |
        curl -Ls "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> $GITHUB_PATH

    - name: Run E2E Tests on Virtual Tablet
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_tablet
        script: ./run_e2e_tests.sh

    - name: Upload Test Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-screenshots
        path: |
          ui_menus_tested.png
          pdf_export_success.png
